<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国の候補者収録・確認状況 | まちの政治台帳</title><link rel="stylesheet" href="style.css"><style>.audit-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.audit-metrics article,.audit-card{background:white;border:1px solid #d9dfd2;border-radius:8px;padding:16px}.audit-metrics strong{font-size:26px;display:block}.audit-filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.audit-filters label{flex:1;min-width:160px;font-size:12px}.audit-card h3{font-size:17px;margin:5px 0}.audit-card p{font-size:12px;color:#526558}.audit-card small{color:#677b6a}#audit-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.audit-help{color:#596f5e;font-size:12px}@media(max-width:700px){.audit-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}#audit-list{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="./"><i>政</i>まちの政治台帳</a><a href="./">自治体一覧へ戻る</a></header><main><section class="finder"><div class="eyebrow">NATIONWIDE ELECTION MONITOR</div><h1>全国の候補者収録・確認状況</h1><p class="audit-help">公開記事は候補者を特定する調査の手掛かりです。記事が表示されても、立候補や正式届出が確認されたことにはなりません。</p><div class="audit-metrics" id="audit-metrics" aria-live="polite"></div><div class="audit-filters"><label>都道府県<select id="audit-pref"><option value="">全国</option></select></label><label>自治体・記事検索<input type="search" id="audit-search" placeholder="例：世田谷区、市長選"></label><label>表示<select id="audit-mode"><option value="leads">一次資料の確認待ち記事</option><option value="missing">首長候補者の未収録自治体</option><option value="recorded">首長候補者の収録あり</option><option value="failed">巡回に失敗した自治体</option></select></label></div><p class="audit-help" id="audit-time"></p><p id="audit-count" aria-live="polite"></p><div id="audit-list"></div><div id="audit-page" class="pager"></div><p class="audit-help">全国1,741自治体を約28日で巡回します。未収録や記事未発見は候補者がいない証拠ではありません。<a href="data/candidate-audit.json">監査データ（J
